name: Test core logic

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRADLE_USER_HOME: /tmp/herodefense-gradle
      HERO_PROJECT_CACHE_DIR: /tmp/herodefense-project-cache

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Test deterministic atlas page planning
        run: python3 -m unittest discover -s tools/blender/tests -v

      - name: Install Pillow for review-strip tests
        run: python3 -m pip install --break-system-packages pillow

      - name: Test review-strip helpers
        run: python3 -m unittest discover -s tools/visual/tests -v

      - name: Validate committed generated-asset metadata
        run: python3 tools/visual/validate_generated_assets.py android/assets/generated

      - name: Run unit tests and the 100-wave balance gate
        run: ./scripts/gradle.sh :core:test --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14
